{% extends "base_admin.html" %}
{% block title %}Delete Room{% endblock %}
{% block page_title %}Delete Room{% endblock %}
{% block content %}
<div class="card form-card fade-in-up">
  <div class="card-header"><h5><i class="fas fa-exclamation-triangle me-2" style="color:#F44336;"></i>Confirm Delete</h5></div>
  <div class="card-body">
    <p>Are you sure you want to delete <strong>Room {{ room.room_no }}</strong>? This cannot be undone.</p>
    <form method="POST" id="delete-room-form">
      {% csrf_token %}
      <div class="d-flex gap-3 mt-4">
        <button type="submit" class="btn-danger-custom" id="btn-confirm-delete-room">Delete Room</button>
        <a href="{% url 'room_list' %}" class="btn-outline-custom" id="btn-cancel-delete-room">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
